<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istanbul Flood Risk Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#10213a; --ink-soft:#56657a; --paper:#eef2f8; --panel:#ffffff; --line:#dbe2ee;
  --navy:#0b1f3f; --navy2:#16407a;
  --accent:#1f6fe0; --accent-soft:rgba(31,111,224,.16);
  --base:#7f8ca3; --worse:#e0412f; --better:#13a36b; --warn:#f2a20c;
  --g-climate:#e8590c; --g-hazard:#7b3fe4; --g-adapt:#0ca678; --g-ins:#1f6fe0;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root { --ink:#e8eef7; --ink-soft:#9fb0c6; --paper:#0a1424; --panel:#122036; --line:#24364f; --accent:#4d94ff; --accent-soft:rgba(77,148,255,.2); --base:#8796ad; --worse:#ff6b57; --better:#2fd08f; color-scheme: dark; } }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45; }
a { color:var(--accent); }
.top { background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 60%,#1b5fa8 100%); color:#fff; position:relative; overflow:hidden; }
.top::after { content:""; position:absolute; inset:auto -10% -60% 40%; height:220%; background:radial-gradient(closest-side,rgba(77,180,255,.35),transparent); pointer-events:none; }
.top .in { max-width:1280px; margin:0 auto; padding:22px 20px 18px; display:flex; flex-wrap:wrap; gap:14px; align-items:end; justify-content:space-between; position:relative; z-index:1; }
.brand { display:flex; gap:14px; align-items:center; }
.logo { width:46px; height:46px; border-radius:12px; background:linear-gradient(135deg,#38bdf8,#1f6fe0); display:grid; place-items:center; box-shadow:0 6px 18px rgba(0,0,0,.25); }
h1 { font-family:var(--display); font-weight:700; font-size:30px; margin:0; letter-spacing:.01em; }
.sub { color:#c6d6ee; margin:3px 0 0; max-width:70ch; font-size:14px; }
.presets { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.presets span { font-size:11.5px; color:#9fbbe0; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
button { font:600 13px var(--body); border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08); color:#fff; padding:8px 13px; border-radius:999px; cursor:pointer; transition:background .15s, transform .15s; }
button:hover { background:rgba(255,255,255,.2); transform:translateY(-1px); }
button[aria-pressed="true"] { background:#fff; color:var(--navy); border-color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.25); }
button:focus-visible, input:focus-visible { outline:2px solid var(--warn); outline-offset:2px; }
.wrap { max-width:1280px; margin:0 auto; padding:16px 20px 40px; display:grid; gap:14px; }
.kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:-2px; }
.kpi { --kc:var(--accent); background:var(--panel); border-radius:12px; padding:14px 16px 12px; display:grid; gap:2px; position:relative; overflow:hidden; box-shadow:0 2px 10px rgba(16,33,58,.08); border:1px solid var(--line); }
.kpi::before { content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--kc); transition:background .3s; }
.kpi::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,color-mix(in srgb,var(--kc) 13%,transparent),transparent 65%); pointer-events:none; transition:background .3s; }
.kpi.up { --kc:var(--worse); } .kpi.down { --kc:var(--better); }
.kpi .lab { font-size:12.5px; color:var(--ink-soft); font-weight:500; }
.kpi .val { font:700 30px var(--mono); font-variant-numeric:tabular-nums; color:var(--kc); transition:color .3s; }
.kpi .val small { font-size:13px; color:var(--ink-soft); font-weight:500; }
.kpi .meta { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; position:relative; z-index:1; }
.chip { font:700 12px var(--mono); padding:2px 8px; border-radius:999px; background:var(--line); color:var(--ink-soft); }
.chip.up { background:var(--worse); color:#fff; } .chip.down { background:var(--better); color:#fff; }
.charts { display:grid; grid-template-columns:1.35fr 1fr; gap:12px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; box-shadow:0 2px 10px rgba(16,33,58,.06); }
.panel h2 { font-family:var(--display); font-size:18px; font-weight:700; margin:0 0 2px; }
.panel p.note { margin:0 0 8px; font-size:12.5px; color:var(--ink-soft); }
svg { width:100%; height:auto; display:block; }
svg text { font-family:var(--body); font-size:11px; fill:var(--ink-soft); }
.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink-soft); margin-top:4px; }
.legend i { display:inline-block; width:18px; height:0; border-top:3px solid var(--scen,var(--accent)); vertical-align:middle; margin-right:5px; }
.legend i.b { border-top:2px dashed var(--base); }
.legend i.z { width:12px; height:10px; border:0; border-radius:2px; }
.levers { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.group { background:var(--panel); border-radius:12px; overflow:hidden; display:grid; align-content:start; box-shadow:0 2px 10px rgba(16,33,58,.08); border:1px solid var(--line); }
.group h3 { margin:0; padding:10px 14px; font-family:var(--display); font-size:15px; font-weight:700; color:#fff; background:linear-gradient(110deg,var(--gc),color-mix(in srgb,var(--gc) 70%,#000)); text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; }
.group h3 em { font-style:normal; font-size:18px; opacity:.9; }
.group .body { padding:12px 14px; display:grid; gap:14px; background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 7%,transparent),transparent 120px); }
.lever { display:grid; gap:3px; }
.lever .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.lever label { font-weight:600; font-size:13.5px; }
.lever output { font:700 12.5px var(--mono); color:#fff; background:var(--gc); padding:2px 8px; border-radius:999px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.lever input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; margin:8px 0 4px; background:linear-gradient(90deg,var(--gc) 0,var(--gc) var(--p,50%),var(--line) var(--p,50%)); cursor:pointer; }
.lever input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; border:4px solid var(--gc); box-shadow:0 2px 6px rgba(0,0,0,.25); }
.lever input[type=range]::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:4px solid var(--gc); box-shadow:0 2px 6px rgba(0,0,0,.25); }
.lever .help { font-size:12px; color:var(--ink-soft); }
.lever .ends { display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.lever.changed label::after { content:" \25CF"; color:var(--gc); }
.story { --sc:var(--accent); border-radius:12px; padding:12px 16px; font-size:14.5px; background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 16%,var(--panel)),var(--panel)); border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line)); border-left:6px solid var(--sc); transition:all .3s; }
.story.up { --sc:var(--worse); } .story.down { --sc:var(--better); }
.lang { display:flex; gap:4px; margin-left:8px; }
.lang button { padding:5px 10px; font-size:12px; }
.kpi .band { font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; position:relative; z-index:1; }
.legend i.u { width:14px; height:10px; border:0; border-radius:2px; background:var(--scen,var(--accent)); opacity:.25; }
.caveat { background:var(--panel); border:1px dashed var(--line); border-radius:12px; padding:10px 14px; font-size:13px; color:var(--ink-soft); }
footer { font-size:12.5px; color:var(--ink-soft); display:grid; gap:6px; max-width:95ch; }
@media (max-width:980px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } .charts { grid-template-columns:1fr; } .levers { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:560px) { .levers,.kpis { grid-template-columns:1fr; } h1 { font-size:24px; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>

    const W = 460, rowH = 25, H = idx.length * rowH + 10, x0 = 118, x1 = W - 58;
    const mx = Math.max(...idx.map(i => Math.max(res.byDistrict[i], baseRes.byDistrict[i]))) || 1;
    const s = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": L("d_t") });
    idx.forEach((i, r) => {
      const y = 4 + r * rowH, w = res.byDistrict[i] / mx * (x1 - x0), bw = baseRes.byDistrict[i] / mx * (x1 - x0);
      svgEl("text", { x: x0 - 8, y: y + 15, "text-anchor": "end", style: "fill: var(--ink)" }, s).textContent = TRN[names[i]] || names[i];
      const ch = baseRes.byDistrict[i] > 0 ? res.byDistrict[i] / baseRes.byDistrict[i] - 1 : 0;
      const bc = ch > 0.01 ? "var(--worse)" : ch < -0.01 ? "var(--better)" : `hsl(${215 - r * 6} 75% ${45 + r * 2.5}%)`;
      svgEl("rect", { x: x0, y: y + 3, width: Math.max(w, 1), height: rowH - 9, rx: 4, fill: bc }, s);
      svgEl("line", { x1: x0 + bw, x2: x0 + bw, y1: y, y2: y + rowH - 3, stroke: "var(--ink)", "stroke-width": 2, "stroke-dasharray": "3 2" }, s);
      svgEl("text", { x: x0 + Math.max(w, bw) + 6, y: y + 15, style: "font-family: var(--mono)" }, s).textContent = `${(res.byDistrict[i] / 1e3).toFixed(0)} k`;
    });
    document.getElementById("dist").replaceChildren(s);
  }
  function story(res) {
    const d = (a, b) => b > 0 ? (a / b - 1) * 100 : 0, f = x => `${x > 0 ? "+" : "−"}${Math.abs(x).toFixed(0)} %`;
    const da = d(res.aal, baseRes.aal), dl = d(res.l200, baseRes.l200);
    const el = document.getElementById("story");
    el.classList.toggle("up", da > 0.5); el.classList.toggle("down", da < -0.5);
    if (Math.abs(da) < 0.5 && Math.abs(dl) < 0.5) { el.innerHTML = L("st_base"); return; }
    el.innerHTML = L("st_head")(f(da), f(dl)) + (Math.abs(da) > Math.abs(dl) + 5 ? L("st_prem") : Math.abs(dl) > Math.abs(da) + 5 ? L("st_tail") : L("st_both"));
  }
  function render() {
    syncInputs();
    const res = engine.run(params);
    const lo = engine.run({ ...params, bias: params.bias * P05 }), hi = engine.run({ ...params, bias: params.bias * P95 });
    const set = (id, v) => document.getElementById(id).innerHTML = `${fm(v)} <small>${L("eur")}</small>`;
    set("k-aal", res.aal); set("k-l200", res.l200); set("k-tvar", res.tvar); set("k-s09", res.s09);
    document.getElementById("m-aal").textContent = lang === "tr" ? `${L("ofTIV")} ‰${num(res.aal / TIV * 1000, 2)}` : `${num(res.aal / TIV * 1000, 2)} ‰ ${L("ofTIV")}`;
    document.getElementById("m-l200").textContent = lang === "tr" ? `${L("ofTIV")} %${num(res.l200 / TIV * 100, 2)}` : `${num(res.l200 / TIV * 100, 2)} % ${L("ofTIV")}`;
    const bandTxt = (a, b) => `${L("band")}: ${fm(a)}–${fm(b)}`;
    document.getElementById("b-aal").textContent = bandTxt(lo.aal, hi.aal);
    document.getElementById("b-l200").textContent = bandTxt(lo.l200, hi.l200);
    document.getElementById("b-tvar").textContent = bandTxt(lo.tvar, hi.tvar);
    chip(document.getElementById("d-aal"), res.aal, baseRes.aal);
    chip(document.getElementById("d-l200"), res.l200, baseRes.l200);
    chip(document.getElementById("d-tvar"), res.tvar, baseRes.tvar);
    chip(document.getElementById("d-s09"), res.s09, baseRes.s09);
    drawEP(res, lo, hi); drawDist(res); story(res);
  }
  let pending = false;
  function schedule() { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); }
  applyText(); render();
})();
</script>
